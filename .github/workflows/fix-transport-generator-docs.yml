name: Fix transport generator docs

on:
  push:
    branches:
      - research/transport-operator-benchmarks

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: research/transport-operator-benchmarks
          fetch-depth: 0
      - name: Correct stale production transport documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-nonlocal-relativity/src/transport.rs')
          text = path.read_text()
          old1 = "/// [`HistoryBackend::push_entry`] implementations. The generic batch contract is\n/// transactional. [`DiscreteConnectionTransport`] specializes it by constructing\n/// one segment operator in `O(D^3)` and applying it to `H` retained vectors in\n/// `O(H * D^2)`, rather than recomputing Christoffel contractions `H` times.\n"
          new1 = "/// [`HistoryBackend::push_entry`] implementations. The generic batch contract is\n/// transactional. [`DiscreteConnectionTransport`] specializes it by contracting\n/// the start/end connection and worldline velocity into two segment generators\n/// once in `O(D^3)`, then evaluating Heun for `H` retained vectors with\n/// `O(H * D^2)` matrix-vector work. The step remains applied after each\n/// matrix-vector product, preserving the scalar path's floating-point range.\n"
          old2 = "/// [`HistoryBackend::push_entry`] dispatches one batch per accepted segment.\n/// This implementation reuses one segment operator across all currently\n/// retained vectors, so transport still accumulates along the actual accepted\n/// worldline polyline rather than jumping directly between a sample's original\n/// recorded point and the current point.\n"
          new2 = "/// [`HistoryBackend::push_entry`] dispatches one batch per accepted segment.\n/// This implementation reuses the two connection-contracted start/end segment\n/// generators across all currently retained vectors while retaining the scalar\n/// Heun ordering `A * V` followed by multiplication by the segment step. Transport\n/// still accumulates along the actual accepted worldline polyline rather than\n/// jumping directly between a sample's original recorded point and the current\n/// point. The explicit [`Self::segment_operator`] is a characterization primitive\n/// and is intentionally not the production batch path.\n"
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('expected stale documentation blocks not found exactly once')
          path.write_text(text.replace(old1, new1).replace(old2, new2))
          PY
          cargo fmt --all -- --check
          git diff --check
      - name: Commit documentation correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scirust-nonlocal-relativity/src/transport.rs
          git diff --cached --quiet && exit 0
          git commit -m 'docs(nonlocal): describe shared-generator production transport'
          git push origin HEAD:research/transport-operator-benchmarks
