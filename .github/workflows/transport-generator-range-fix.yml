name: Range-preserving batch transport fixer

on:
  push:
    branches:
      - research/transport-operator-production-clean

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: research/transport-operator-production-clean
          fetch-depth: 0
      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Preserve scalar dynamic range while sharing generators
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scirust-nonlocal-relativity/src/transport.rs')
          text = path.read_text()

          text = text.replace(
              '''/// transactional. [`DiscreteConnectionTransport`] specializes it by constructing
              /// one segment operator in `O(D^3)` and applying it to `H` retained vectors in
              /// `O(H * D^2)`, rather than recomputing Christoffel contractions `H` times.
              ''',
              '''/// transactional. [`DiscreteConnectionTransport`] specializes it by contracting
              /// the connection and worldline velocity into two segment generators once in
              /// `O(D^3)`, then evaluating Heun for `H` retained vectors with `O(H * D^2)`
              /// matrix-vector work. The step is still applied after each matrix-vector
              /// product, preserving the scalar path's floating-point dynamic range.
              ''',
              1,
          )
          text = text.replace(
              '''/// [`HistoryBackend::push_entry`] dispatches one batch per accepted segment.
              /// This implementation reuses one segment operator across all currently
              /// retained vectors, so transport still accumulates along the actual accepted
              /// worldline polyline rather than jumping directly between a sample's original
              /// recorded point and the current point.
              ''',
              '''/// [`HistoryBackend::push_entry`] dispatches one batch per accepted segment.
              /// This implementation reuses the two connection-contracted segment generators
              /// across all currently retained vectors while retaining the scalar Heun order
              /// `A * V` followed by multiplication by the segment step. Transport therefore
              /// accumulates along the actual accepted worldline polyline without compressing
              /// extreme-vector dynamics into a pre-rounded `f64` operator coefficient.
              ''',
              1,
          )

          segment_start = text.find('    pub fn segment_operator<B, const D: usize>(')
          if segment_start < 0:
              raise SystemExit('segment_operator not found')
          segment_body_start = text.find('    {\n', segment_start)
          scale_marker = '        let mut start_scaled = transport_generator(&start_symbols, &from_state.velocity);\n'
          scale_pos = text.find(scale_marker, segment_body_start)
          if scale_pos < 0:
              raise SystemExit('segment_operator generator block not found')
          old_prefix = text[segment_body_start + 6:scale_pos]
          expected_fragments = [
              'if !segment_step.is_finite()',
              'let start_symbols = background.christoffel(&from_state.coordinates);',
              'let end_symbols = background.christoffel(&to_state.coordinates);',
          ]
          if not all(fragment in old_prefix for fragment in expected_fragments):
              raise SystemExit('unexpected segment_operator prefix')
          new_prefix = '''        if !segment_step.is_finite()
                  {
                      return Err(NonlocalRelativityError::InvalidTransportSegmentStep(
                          segment_step,
                      ));
                  }

                  let (start_generator, end_generator) =
                      Self::segment_generators(background, from_state, to_state)?;
                  let mut start_scaled = start_generator;
                  let mut end_scaled = end_generator;
          '''
          old_scale_lines = '''        let mut start_scaled = transport_generator(&start_symbols, &from_state.velocity);
                  let mut end_scaled = transport_generator(&end_symbols, &to_state.velocity);
          '''
          old_full_prefix = old_prefix + old_scale_lines
          text = text[:segment_body_start + 6] + new_prefix + text[scale_pos + len(old_scale_lines):]

          impl_marker = 'impl DiscreteConnectionTransport {\n'
          impl_pos = text.find(impl_marker)
          if impl_pos < 0:
              raise SystemExit('inherent impl not found')
          helper = r'''    fn segment_generators<B, const D: usize>(
                  background: &B,
                  from_state: &WorldlineState<D>,
                  to_state: &WorldlineState<D>,
              ) -> NonlocalResult<([[f64; D]; D], [[f64; D]; D])>
              where
                  B: Connection<D>,
              {
                  let start_symbols = background.christoffel(&from_state.coordinates);
                  validate_transport_christoffel(&start_symbols)?;
                  let end_symbols = background.christoffel(&to_state.coordinates);
                  validate_transport_christoffel(&end_symbols)?;
                  Ok((
                      transport_generator(&start_symbols, &from_state.velocity),
                      transport_generator(&end_symbols, &to_state.velocity),
                  ))
              }

          '''
          text = text[:impl_pos + len(impl_marker)] + helper + text[impl_pos + len(impl_marker):]

          old_batch = '''        let operator = Self::segment_operator(background, from_state, to_state, segment_step)?;
                  let mut outputs = Vec::with_capacity(vectors.len());
                  for (retained_index, vector) in vectors.iter().copied().enumerate()
                  {
                      outputs.push(Self::apply_segment_operator(
                          &operator,
                          vector,
                          retained_index,
                      )?);
                  }
                  vectors.copy_from_slice(&outputs);
                  Ok(())
          '''
          new_batch = '''        if !segment_step.is_finite()
                  {
                      return Err(NonlocalRelativityError::InvalidTransportSegmentStep(
                          segment_step,
                      ));
                  }
                  let (start_generator, end_generator) =
                      Self::segment_generators(background, from_state, to_state)?;
                  let mut outputs = Vec::with_capacity(vectors.len());
                  for (retained_index, vector) in vectors.iter().copied().enumerate()
                  {
                      outputs.push(heun_discrete_parallel_transport_from_generators(
                          retained_index,
                          vector,
                          &start_generator,
                          &end_generator,
                          segment_step,
                      )?);
                  }
                  vectors.copy_from_slice(&outputs);
                  Ok(())
          '''
          if old_batch not in text:
              raise SystemExit('operator batch block not found')
          text = text.replace(old_batch, new_batch, 1)

          helper_marker = 'fn heun_discrete_parallel_transport<B, const D: usize>('
          helper_pos = text.find(helper_marker)
          if helper_pos < 0:
              raise SystemExit('scalar Heun helper not found')
          shared_helper = r'''fn heun_discrete_parallel_transport_from_generators<const D: usize>(
              retained_index: usize,
              vector: [f64; D],
              start_generator: &[[f64; D]; D],
              end_generator: &[[f64; D]; D],
              segment_step: f64,
          ) -> NonlocalResult<[f64; D]> {
              validate_history_velocity(&vector, retained_index)?;
              let start_derivative = generator_transport_derivative(start_generator, &vector);
              validate_transported_vector(&start_derivative, retained_index)?;

              let mut predicted = [0.0_f64; D];
              for mu in 0..D
              {
                  predicted[mu] = vector[mu] + segment_step * start_derivative[mu];
              }
              validate_transported_vector(&predicted, retained_index)?;

              let end_derivative = generator_transport_derivative(end_generator, &predicted);
              validate_transported_vector(&end_derivative, retained_index)?;

              let mut corrected = [0.0_f64; D];
              for mu in 0..D
              {
                  corrected[mu] =
                      vector[mu] + 0.5 * segment_step * (start_derivative[mu] + end_derivative[mu]);
              }
              validate_transported_vector(&corrected, retained_index)?;
              Ok(corrected)
          }

          '''
          text = text[:helper_pos] + shared_helper + text[helper_pos:]

          derivative_marker = '/// Evaluate `-Gamma^mu_(alpha beta) u^alpha V^beta`, the linear parallel\n'
          derivative_pos = text.find(derivative_marker)
          if derivative_pos < 0:
              raise SystemExit('scalar derivative marker not found')
          generator_derivative = r'''/// Evaluate `-A^mu_beta V^beta` after the connection/velocity contraction.
          fn generator_transport_derivative<const D: usize>(
              generator: &[[f64; D]; D],
              vector: &[f64; D],
          ) -> [f64; D] {
              let mut derivative = [0.0_f64; D];
              for (row, output) in generator.iter().zip(derivative.iter_mut())
              {
                  for (coefficient, value) in row.iter().zip(vector.iter())
                  {
                      *output -= coefficient * value;
                  }
              }
              derivative
          }

          '''
          text = text[:derivative_pos] + generator_derivative + text[derivative_pos:]
          path.write_text(text)

          tests_path = Path('scirust-nonlocal-relativity/tests/transport_operator_factorization.rs')
          tests = tests_path.read_text()
          tests += r'''

          #[derive(Debug, Clone, Copy)]
          struct TinyOffDiagonalConnection;

          impl Connection<2> for TinyOffDiagonalConnection {
              fn christoffel(&self, _coordinates: &[f64; 2]) -> [[[f64; 2]; 2]; 2] {
                  let mut symbols = [[[0.0_f64; 2]; 2]; 2];
                  symbols[0][0][1] = 1.0e-100;
                  symbols
              }
          }

          #[test]
          fn production_batch_preserves_terms_that_a_precomputed_f64_operator_can_underflow() {
              let transport = DiscreteConnectionTransport;
              let from = WorldlineState::new([0.0, 0.0], [1.0, 0.0]);
              let to = WorldlineState::new([1.0e-308, 0.0], [1.0, 0.0]);
              let step = 1.0e-308;
              let input = [0.0, 1.0e308];

              let scalar = transport
                  .transport_segment(0, &TinyOffDiagonalConnection, input, &from, &to, step)
                  .expect("scalar Heun oracle must preserve the representable correction");
              let mut batch = [input];
              transport
                  .transport_batch(
                      &TinyOffDiagonalConnection,
                      &mut batch,
                      &from,
                      &to,
                      step,
                  )
                  .expect("shared-generator batch must preserve scalar dynamic range");

              assert!(scalar[0].is_finite());
              assert!(batch[0][0].is_finite());
              assert!(scalar[0] != 0.0, "scalar oracle must exercise a nonzero correction");
              assert_eq!(batch[0][0].to_bits(), scalar[0].to_bits());
              assert_eq!(batch[0][1].to_bits(), scalar[1].to_bits());
          }
          '''
          tests_path.write_text(tests)
          PY

      - name: Validate corrected production path
        run: |
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 test --locked -p scirust-nonlocal-relativity --test transport_operator_factorization
          cargo +nightly-2026-07-02 test --locked -p scirust-nonlocal-relativity
          cargo +nightly-2026-07-02 clippy --locked -p scirust-nonlocal-relativity --all-targets -- -D warnings
          git diff --check
      - name: Commit range-preserving production path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-nonlocal-relativity/src/transport.rs \
            scirust-nonlocal-relativity/tests/transport_operator_factorization.rs
          git commit -m "fix(nonlocal): preserve scalar range in batched transport"
          git push origin HEAD:research/transport-operator-production-clean
