name: Transport documentation fixer

on:
  push:
    branches:
      - research/transport-operator-production-clean

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: research/transport-operator-production-clean
      - name: Fix stale transport documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scirust-nonlocal-relativity/src/transport.rs')
          text = path.read_text()
          old = '''/// [`HistoryBackend::push_entry`] calls this once per accepted segment for
          /// every currently retained vector, so transport accumulates along the
          /// actual accepted worldline polyline rather than jumping directly between a
          /// sample's original recorded point and the current point.
          '''
          new = '''/// [`HistoryBackend::push_entry`] dispatches one batch per accepted segment.
          /// This implementation reuses one segment operator across all currently
          /// retained vectors, so transport still accumulates along the actual accepted
          /// worldline polyline rather than jumping directly between a sample's original
          /// recorded point and the current point.
          '''
          if old not in text:
              raise SystemExit('stale transport documentation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all -- --check
          git diff --check
      - name: Commit documentation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-nonlocal-relativity/src/transport.rs
          git commit -m "docs(nonlocal): describe batched retained transport accurately"
          git push origin HEAD:research/transport-operator-production-clean
