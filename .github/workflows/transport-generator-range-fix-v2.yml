name: Range-preserving batch transport fixer v2

on:
  push:
    branches:
      - research/transport-operator-production-clean

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: research/transport-operator-production-clean
          fetch-depth: 0
      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Reapply range-preserving patch with typed generator alias
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/transport-generator-range-fix.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate corrected production path"
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('unable to extract original range-preserving patch script')
          script = workflow[start + len(start_marker):end]
          lines = script.splitlines()
          stripped = []
          for line in lines:
              if line.startswith('          '):
                  stripped.append(line[10:])
              else:
                  stripped.append(line)
          Path('/tmp/range_fix.py').write_text('\n'.join(stripped) + '\n')
          PY
          python3 /tmp/range_fix.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scirust-nonlocal-relativity/src/transport.rs')
          text = path.read_text()
          use_marker = 'use crate::{\n'
          pos = text.find(use_marker)
          if pos < 0:
              raise SystemExit('crate import marker not found')
          import_end = text.find('\n};', pos)
          if import_end < 0:
              raise SystemExit('crate import end not found')
          insert_at = import_end + len('\n};')
          alias = '\n\ntype TransportGenerator<const D: usize> = [[f64; D]; D];'
          if 'type TransportGenerator<const D: usize>' not in text:
              text = text[:insert_at] + alias + text[insert_at:]

          old = ') -> NonlocalResult<([[f64; D]; D], [[f64; D]; D])>'
          new = ') -> NonlocalResult<(TransportGenerator<D>, TransportGenerator<D>)>'
          if old not in text:
              raise SystemExit('segment_generators return type not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate corrected production path
        run: |
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 test --locked -p scirust-nonlocal-relativity --test transport_operator_factorization
          cargo +nightly-2026-07-02 test --locked -p scirust-nonlocal-relativity
          cargo +nightly-2026-07-02 clippy --locked -p scirust-nonlocal-relativity --all-targets -- -D warnings
          git diff --check
      - name: Commit range-preserving production path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scirust-nonlocal-relativity/src/transport.rs \
            scirust-nonlocal-relativity/tests/transport_operator_factorization.rs
          git commit -m "fix(nonlocal): preserve scalar range in batched transport"
          git push origin HEAD:research/transport-operator-production-clean
