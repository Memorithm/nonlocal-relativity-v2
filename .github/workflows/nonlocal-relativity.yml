name: Nonlocal Relativity

# Run the complete scientific gate on the repository's trusted Thor runner.
# Keep the numerical commands and pinned toolchain identical to the hosted
# gate; moving execution does not waive checks or change scientific claims.
on:
  push:
    branches: [master, main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "scirust-fractional/**"
      - "scirust-history/**"
      - "scirust-relativity/**"
      - "scirust-nonlocal-relativity/**"
      - "experiments/nonlocal-relativity-v2/**"
      - "paper/nonlocal-relativity-v2.md"
      - ".github/workflows/nonlocal-relativity.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "scirust-fractional/**"
      - "scirust-history/**"
      - "scirust-relativity/**"
      - "scirust-nonlocal-relativity/**"
      - "experiments/nonlocal-relativity-v2/**"
      - "paper/nonlocal-relativity-v2.md"
      - ".github/workflows/nonlocal-relativity.yml"
  workflow_dispatch:

concurrency:
  group: nonlocal-relativity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: fmt / clippy / test / docs
    # Match the existing native gate: never execute fork code on Thor.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 120
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare writable toolchain and temporary directories
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-nonlocal.XXXXXX")"
          mkdir -p "$tmpdir/rustup" "$tmpdir/cargo"
          chmod 700 "$tmpdir" "$tmpdir/rustup" "$tmpdir/cargo"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$tmpdir/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$tmpdir/cargo" >> "$GITHUB_ENV"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: nonlocal-relativity-thor

      - name: Formatting
        run: cargo +nightly-2026-07-02 fmt --all -- --check

      - name: Staged scirust-history standalone validation
        run: |
          cargo +nightly-2026-07-02 fmt \
            --manifest-path scirust-history/Cargo.toml \
            -- --check
          cargo +nightly-2026-07-02 clippy \
            --manifest-path scirust-history/Cargo.toml \
            --all-targets \
            -- -D warnings
          cargo +nightly-2026-07-02 test \
            --manifest-path scirust-history/Cargo.toml

      - name: Clippy (deny warnings)
        run: |
          cargo +nightly-2026-07-02 clippy --locked \
            -p scirust-fractional \
            -p scirust-relativity \
            -p scirust-nonlocal-relativity \
            --all-targets \
            --all-features \
            -- -D warnings

      - name: Tests
        run: |
          cargo +nightly-2026-07-02 test --locked \
            -p scirust-fractional \
            -p scirust-relativity \
            -p scirust-nonlocal-relativity

      - name: Documentation tests
        run: |
          cargo +nightly-2026-07-02 test --locked \
            -p scirust-nonlocal-relativity \
            --doc

      - name: Geometric flat cross-chart diagnostic
        run: |
          cargo +nightly-2026-07-02 run --locked --release \
            -p nonlocal-relativity-experiments \
            --bin geometric_state_diagnostic

      - name: Whitespace / conflict-marker check (git diff --check)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The full checkout already contains the base. Do not fetch again
          # after checkout deliberately removed the repository credentials.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$(git merge-base "$BASE_SHA" HEAD)"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            base="HEAD~1"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            echo "Checking diff $base..HEAD for whitespace/conflict markers"
            git diff --check "$base" HEAD
          else
            echo "No base revision available; skipping git diff --check"
          fi

      - name: Forbidden-marker scan
        run: |
          scan="scirust-fractional scirust-history scirust-relativity scirust-nonlocal-relativity"
          [ -d experiments/nonlocal-relativity-v2 ] && scan="$scan experiments/nonlocal-relativity-v2"
          [ -f paper/nonlocal-relativity-v2.md ] && scan="$scan paper/nonlocal-relativity-v2.md"
          echo "Scanning: $scan"
          if grep -RInE 'TODO|FIXME|placeholder|stub|unimplemented!|todo!' $scan; then
            echo "::error::forbidden marker found in hardened sources"
            exit 1
          fi
          echo "No forbidden markers."

  examples:
    name: run examples (release)
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 120
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare writable toolchain and temporary directories
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "$GITHUB_WORKSPACE/.ci-nonlocal.XXXXXX")"
          mkdir -p "$tmpdir/rustup" "$tmpdir/cargo"
          chmod 700 "$tmpdir" "$tmpdir/rustup" "$tmpdir/cargo"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$tmpdir/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$tmpdir/cargo" >> "$GITHUB_ENV"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-02

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: nonlocal-relativity-thor

      - name: Build and run every nonlocal-relativity example (release)
        run: |
          set -euo pipefail
          shopt -s nullglob
          examples=(scirust-nonlocal-relativity/examples/*.rs)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "::error::no examples discovered"
            exit 1
          fi
          cargo +nightly-2026-07-02 build --locked --release \
            -p scirust-nonlocal-relativity --examples
          for path in "${examples[@]}"; do
            name="$(basename "$path" .rs)"
            echo "==== running example: $name ===="
            cargo +nightly-2026-07-02 run --locked --release \
              -p scirust-nonlocal-relativity --example "$name" >/dev/null
          done
          echo "All ${#examples[@]} examples ran successfully."
