name: Transport generator benchmark

on:
  push:
    branches:
      - research/transport-operator-benchmarks

permissions:
  contents: read

jobs:
  validate-and-measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Validate benchmark slice
        run: |
          cargo fmt --all -- --check
          cargo test -p scirust-nonlocal-relativity --test transport_generator_cost
          cargo clippy -p scirust-nonlocal-relativity --all-targets -- -D warnings
          git diff --check
      - name: Measure shared-generator transport
        run: |
          cargo bench -p scirust-nonlocal-relativity --bench transport_generators -- \
            --sample-size 20 --warm-up-time 0.2 --measurement-time 0.5
