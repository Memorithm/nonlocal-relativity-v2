name: History lock normalizer

on:
  push:
    branches:
      - research/history-workspace-promotion

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: research/history-workspace-promotion
          fetch-depth: 0

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Restore main lock and apply only history deltas
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- Cargo.lock
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.lock")
          lock = path.read_text()

          insertion = '''[[package]]
          name = "scirust-hvac"
          version = "0.1.0"
          '''
          history = '''[[package]]
          name = "scirust-history"
          version = "0.1.0"

          [[package]]
          name = "scirust-hvac"
          version = "0.1.0"
          '''
          if insertion not in lock:
              raise SystemExit("history package insertion point not found")
          lock = lock.replace(insertion, history, 1)

          dependency = '''[[package]]
          name = "scirust-nonlocal-relativity"
          version = "0.1.0"
          dependencies = [
           "criterion",
           "scirust-fractional",
           "scirust-relativity",
          ]
          '''
          dependency_with_history = '''[[package]]
          name = "scirust-nonlocal-relativity"
          version = "0.1.0"
          dependencies = [
           "criterion",
           "scirust-fractional",
           "scirust-history",
           "scirust-relativity",
          ]
          '''
          if dependency not in lock:
              raise SystemExit("nonlocal lock dependency block not found")
          lock = lock.replace(dependency, dependency_with_history, 1)
          path.write_text(lock)
          PY

      - name: Validate minimal locked graph
        run: |
          cargo +nightly-2026-07-02 metadata --locked --no-deps --format-version 1 >/dev/null
          cargo +nightly-2026-07-02 test --locked -p scirust-history -p scirust-nonlocal-relativity
          cargo +nightly-2026-07-02 clippy --locked \
            -p scirust-history \
            -p scirust-nonlocal-relativity \
            --all-targets \
            -- -D warnings
          git diff --check

      - name: Commit normalized lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(history): keep lockfile promotion minimal"
          git push origin HEAD:research/history-workspace-promotion
