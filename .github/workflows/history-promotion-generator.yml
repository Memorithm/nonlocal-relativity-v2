name: History promotion generator

on:
  push:
    branches:
      - research/history-workspace-promotion

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: research/history-workspace-promotion
          fetch-depth: 0

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy

      - name: Promote generic history and wire adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root_path = Path("Cargo.toml")
          root = root_path.read_text()
          needle = '    "scirust-fractional",\n    "scirust-relativity",'
          replacement = '    "scirust-fractional",\n    "scirust-history",\n    "scirust-relativity",'
          if needle not in root:
              raise SystemExit("root workspace insertion point not found")
          root = root.replace(needle, replacement, 1)
          staged = '''    # Staged upstream history crate: validated standalone in the focused
              # nonlocal-relativity workflow until the root Cargo.lock promotion lands.
              "scirust-history",
          '''
          if staged not in root:
              raise SystemExit("staged history exclude block not found")
          root = root.replace(staged, "", 1)
          root_path.write_text(root)

          manifest_path = Path("scirust-nonlocal-relativity/Cargo.toml")
          manifest = manifest_path.read_text()
          dep_needle = 'scirust-fractional = { path = "../scirust-fractional" }\nscirust-relativity = { path = "../scirust-relativity" }'
          dep_replacement = 'scirust-fractional = { path = "../scirust-fractional" }\nscirust-history = { path = "../scirust-history" }\nscirust-relativity = { path = "../scirust-relativity" }'
          if dep_needle not in manifest:
              raise SystemExit("nonlocal dependency insertion point not found")
          manifest_path.write_text(manifest.replace(dep_needle, dep_replacement, 1))

          lib_path = Path("scirust-nonlocal-relativity/src/lib.rs")
          lib = lib_path.read_text()
          mod_needle = "mod geometric_error;\nmod modulation;"
          if mod_needle not in lib:
              raise SystemExit("history adapter module insertion point not found")
          lib = lib.replace(mod_needle, "mod geometric_error;\nmod history_adapter;\nmod modulation;", 1)
          export_needle = '''pub use geometric_error::{
              OrthonormalTetrad, TetradStateError, TimelikeStateError, build_orthonormal_tetrad,
              tetrad_state_error, timelike_state_error,
          };
          pub use modulation::{'''
          export_replacement = '''pub use geometric_error::{
              OrthonormalTetrad, TetradStateError, TimelikeStateError, build_orthonormal_tetrad,
              tetrad_state_error, timelike_state_error,
          };
          pub use history_adapter::{
              PositionedVelocity, approximation_from_fidelity, fidelity_from_approximation,
              positioned_velocity,
          };
          pub use modulation::{'''
          if export_needle not in lib:
              raise SystemExit("history adapter export insertion point not found")
          lib_path.write_text(lib.replace(export_needle, export_replacement, 1))
          PY

          cat > scirust-nonlocal-relativity/src/history_adapter.rs <<'RS'
          //! Adapter between relativistic retained-history samples and `scirust-history`.
          //!
          //! This module deliberately adapts only domain-neutral history semantics:
          //! retained value, true logical position, and reference-versus-approximation
          //! classification. General-relativistic source coordinates and mutable
          //! segment-by-segment transport remain owned by this crate.

          use scirust_history::{HistoryEntry as GenericHistoryEntry, HistoryFidelity};

          use crate::{HistoryApproximation, HistoryEntry};

          /// Domain-neutral view of one relativistic velocity sample at its true parameter.
          pub type PositionedVelocity<const D: usize> = GenericHistoryEntry<[f64; D], f64>;

          /// Convert one typed relativistic history entry into the generic retained-history form.
          ///
          /// The velocity components are copied bit-for-bit and `parameter` is used as the
          /// original logical position. Coordinates are intentionally not transferred: they
          /// are geometric metadata required by relativistic transport, not generic history
          /// semantics.
          #[must_use]
          pub const fn positioned_velocity<const D: usize>(entry: &HistoryEntry<D>) -> PositionedVelocity<D> {
              GenericHistoryEntry::new(entry.velocity, entry.parameter)
          }

          /// Convert the generic history fidelity classification into this crate's legacy
          /// compatibility classification.
          #[must_use]
          pub const fn approximation_from_fidelity(fidelity: HistoryFidelity) -> HistoryApproximation {
              match fidelity
              {
                  HistoryFidelity::Reference => HistoryApproximation::Exact,
                  HistoryFidelity::Approximation => HistoryApproximation::Approximate,
              }
          }

          /// Convert this crate's legacy compatibility classification into the generic
          /// history fidelity classification.
          #[must_use]
          pub const fn fidelity_from_approximation(approximation: HistoryApproximation) -> HistoryFidelity {
              match approximation
              {
                  HistoryApproximation::Exact => HistoryFidelity::Reference,
                  HistoryApproximation::Approximate => HistoryFidelity::Approximation,
              }
          }

          #[cfg(test)]
          mod tests {
              use scirust_history::HistoryFidelity;

              use super::{approximation_from_fidelity, fidelity_from_approximation, positioned_velocity};
              use crate::{HistoryApproximation, HistoryEntry};

              #[test]
              fn positioned_velocity_preserves_bits_and_true_parameter() {
                  let entry = HistoryEntry::new(
                      [1.0_f64, -2.0, 3.5, 4.0],
                      [
                          f64::from_bits(1),
                          -0.0,
                          7.25,
                          f64::from_bits(0x7fe0_0000_0000_0001),
                      ],
                      0.375,
                  );

                  let generic = positioned_velocity(&entry);
                  for (actual, expected) in generic.value().iter().zip(entry.velocity.iter())
                  {
                      assert_eq!(actual.to_bits(), expected.to_bits());
                  }
                  assert_eq!(generic.position().to_bits(), entry.parameter.to_bits());
              }

              #[test]
              fn fidelity_mapping_is_exact_and_round_trips() {
                  for approximation in [
                      HistoryApproximation::Exact,
                      HistoryApproximation::Approximate,
                  ]
                  {
                      let fidelity = fidelity_from_approximation(approximation);
                      assert_eq!(approximation_from_fidelity(fidelity), approximation);
                  }

                  assert_eq!(
                      approximation_from_fidelity(HistoryFidelity::Reference),
                      HistoryApproximation::Exact
                  );
                  assert_eq!(
                      approximation_from_fidelity(HistoryFidelity::Approximation),
                      HistoryApproximation::Approximate
                  );
              }
          }
          RS

      - name: Generate lockfile mechanically
        run: cargo +nightly-2026-07-02 generate-lockfile

      - name: Format and validate focused crates
        run: |
          cargo +nightly-2026-07-02 fmt --all
          cargo +nightly-2026-07-02 test --locked -p scirust-history -p scirust-nonlocal-relativity
          cargo +nightly-2026-07-02 clippy --locked \
            -p scirust-history \
            -p scirust-nonlocal-relativity \
            --all-targets \
            -- -D warnings
          git diff --check

      - name: Commit generated promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock scirust-nonlocal-relativity/Cargo.toml \
            scirust-nonlocal-relativity/src/lib.rs \
            scirust-nonlocal-relativity/src/history_adapter.rs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(history): promote generic history into workspace"
          git push origin HEAD:research/history-workspace-promotion
